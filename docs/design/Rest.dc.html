<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Відпочинок</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#C93C12}a:hover{color:#9E2E0C}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4F4F1;color:#141414;font-family:'Exo 2',sans-serif;position:relative;overflow:hidden">
<div style="padding:44px 20px 0;display:flex;flex-direction:column;gap:16px;align-items:stretch">
<div style="display:flex;justify-content:space-between;align-items:center">
<span style="font-size:13px;font-weight:700;color:#5E5E58">ВІДПОЧИНОК</span>
<span style="font-size:13px;color:#5E5E58">загалом 25:31</span>
</div>
<div style="display:flex;align-items:center;gap:10px;background:#FFFFFF;border:1px solid #E1E1DB;border-radius:14px;padding:10px 12px">
<span style="width:24px;height:24px;border-radius:7px;background:#141414;display:flex;align-items:center;justify-content:center"><svg width="13" height="13" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
<span style="flex:1;font-size:14px;font-weight:600">Підхід 3 записано</span>
<span style="font-size:14px;font-weight:800">100 кг × 7</span>
</div>
<div style="position:relative;width:220px;height:220px;align-self:center">
<svg width="220" height="220" viewBox="0 0 260 260" role="img" aria-label="Залишилось 2 хвилини 14 секунд з 3 хвилин">
<circle cx="130" cy="130" r="110" fill="none" stroke="#E8E8E2" stroke-width="14"></circle>
<circle cx="130" cy="130" r="110" fill="none" stroke="#C93C12" stroke-width="14" stroke-linecap="round" stroke-dasharray="514.6 691.15" transform="rotate(-90 130 130)"></circle>
</svg>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
<span style="font-size:64px;font-weight:800;line-height:1">2:14</span>
<span style="font-size:13px;color:#5E5E58">з 3:00</span>
</div>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<button style="height:50px;border:1px solid #E1E1DB;background:#FFFFFF;border-radius:14px;font:800 15px 'Exo 2',sans-serif;color:#141414">−15 с</button>
<button style="height:50px;border:1px solid #E1E1DB;background:#FFFFFF;border-radius:14px;font:800 15px 'Exo 2',sans-serif;color:#141414">+30 с</button>
<a href="Active.dc.html" style="height:50px;box-sizing:border-box;border:1px solid #141414;background:#FFFFFF;border-radius:14px;font-size:15px;font-weight:800;color:#141414;text-decoration:none;display:flex;align-items:center;justify-content:center">Пропустити</a>
</div>
<div style="background:#141414;color:#FFFFFF;border-radius:20px;padding:16px;display:flex;justify-content:space-between;align-items:center">
<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-size:12px;color:#B9B9B2">Далі · підхід 4 з 4</span>
<span style="font-size:18px;font-weight:800">План: 100 кг × 8</span>
</div>
<a href="Active.dc.html" style="text-decoration:none;background:#C93C12;color:#FFFFFF;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700">Почати</a>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:2px">
<dc-import name="RestTip" tip="{{tip}}" hint-size="350px,200px"></dc-import>
<button onClick="{{nextTip}}" style="border:0;background:transparent;padding:8px 12px;font:700 13px 'Exo 2',sans-serif;color:#C93C12">Інша порада</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tip: 0 };
}
renderVals() {
return { tip: this.state.tip, nextTip: () => this.setState({ tip: (this.state.tip + 1) % 10 }) };
}
}
</script>
</body>
</html>
