</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dash","cal","prog","hab","prof"],"default":"dash"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'dash';
const keys = ['dash','cal','prog','hab','prof'];
const col = {}, wt = {};
keys.forEach((k) => { col[k] = k === a ? '#C93C12' : '#5E5E58'; wt[k] = k === a ? 700 : 600; });
return { col, wt };
}
}
</script>
