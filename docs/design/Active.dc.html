<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Активне тренування</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#C93C12}a:hover{color:#9E2E0C}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4F4F1;color:#141414;font-family:'Exo 2',sans-serif;position:relative;overflow:hidden">
<div style="padding:44px 20px 0;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;justify-content:space-between;align-items:center">
<a href="Dashboard.dc.html" aria-label="Згорнути тренування" style="width:40px;height:40px;border-radius:12px;border:1px solid #E1E1DB;background:#FFFFFF;color:#141414;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
<div style="display:flex;flex-direction:column;align-items:center">
<span style="font-size:16px;font-weight:800">Ноги</span>
<span style="font-size:12px;color:#5E5E58">загалом 24:15</span>
</div>
<button style="height:40px;padding:0 10px;gap:6px;font:700 13px 'Exo 2',sans-serif;border-radius:12px;border:1px solid #E1E1DB;background:#FFFFFF;color:#141414;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v16H5z"></path><path d="M9 9h6M9 13h6M9 17h3"></path></svg>Нотатка</button>
</div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px">
<span style="height:5px;border-radius:3px;background:#C93C12"></span>
<span style="height:5px;border-radius:3px;background:#E1E1DB"></span>
<span style="height:5px;border-radius:3px;background:#E1E1DB"></span>
<span style="height:5px;border-radius:3px;background:#E1E1DB"></span>
</div>
<div style="display:flex;flex-direction:column;gap:4px;padding-top:4px">
<span style="font-size:12px;font-weight:700;color:#5E5E58">ВПРАВА 1 З 4</span>
<h1 style="margin:0;font-size:28px;font-weight:800;letter-spacing:-0.5px;line-height:1.1">Присідання зі штангою</h1>
</div>
<div style="display:flex;align-items:center;gap:8px;background:#FFFFFF;border:1px solid #E1E1DB;border-radius:12px;padding:10px 12px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5E58" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5M12 7v5l3 2"></path></svg>
<span style="font-size:13px;color:#5E5E58">Минулого разу:</span>
<span style="font-size:13px;font-weight:700">100 кг × 8, 8, 7</span>
</div>
<div style="background:#141414;color:#FFFFFF;border-radius:22px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:6px">
<span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#FFB59B"><span style="width:8px;height:8px;border-radius:50%;background:#FF6A3D"></span>Підхід 3 з 4 триває</span>
<span style="font-size:64px;font-weight:800;line-height:1;letter-spacing:1px">00:42</span>
<span style="font-size:12px;color:#B9B9B2">план: 100 кг × 8 · відпочинок 3:00</span>
</div>
<div style="background:#FFFFFF;border:1px solid #E1E1DB;border-radius:18px;padding:6px 14px;display:flex;flex-direction:column">
<sc-for list="{{sets}}" as="s" hint-placeholder-count="4">
<div style="display:grid;grid-template-columns:44px 1fr 70px 50px;align-items:center;height:42px;border-bottom:{{s.bd}};font-size:14px">
<span style="font-weight:800;color:{{s.nc}}">{{s.no}}</span>
<span style="display:flex;align-items:center;gap:6px;font-weight:700">{{s.w}}<span style="font-size:10px;font-weight:700;color:#5E5E58;background:#F4F4F1;border-radius:6px;padding:2px 5px;display:{{s.tag}}">РОЗМИНКА</span></span>
<span style="color:#5E5E58">{{s.t}}</span>
<span style="text-align:right;font-weight:700;color:{{s.okc}}">{{s.ok}}</span>
</div>
</sc-for>
</div>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;padding:12px 20px 30px;display:flex;flex-direction:column;gap:8px;background:#F4F4F1">
<a href="LogSet.dc.html" style="display:block;text-align:center;text-decoration:none;background:#C93C12;color:#FFFFFF;border-radius:14px;padding:16px;font-size:16px;font-weight:700">Завершити підхід</a>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
<button onClick="{{toggleWarm}}" aria-pressed="{{warmPressed}}" style="display:flex;align-items:center;justify-content:center;gap:6px;background:{{warmBg}};border:1px solid #141414;color:{{warmFg}};border-radius:14px;padding:14px 8px;font:700 15px 'Exo 2',sans-serif"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14.8V5a2 2 0 1 1 4 0v9.8a4 4 0 1 1-4 0z"></path><path d="M12 9v7"></path></svg>{{warmLabel}}</button>
<a href="Summary.dc.html" style="display:block;text-align:center;text-decoration:none;background:#FFFFFF;border:1px solid #141414;color:#141414;border-radius:14px;padding:14px 8px;font-size:15px;font-weight:700">Завершити вправу</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { warm: false };
}
renderVals() {
const line = '1px solid #EFEFEA';
const warm = this.state.warm;
const ui = {
toggleWarm: () => this.setState({ warm: !this.state.warm }),
warmPressed: warm ? 'true' : 'false',
warmBg: warm ? '#141414' : '#FFFFFF', warmFg: warm ? '#FFFFFF' : '#141414',
warmLabel: warm ? 'Розминка 4:12' : 'Розминка'
};
const sets = [
{ no: '1', nc: '#141414', w: '100 кг × 8', tag: 'none', t: '0:48', ok: '✓', okc: '#141414', bd: line },
{ no: '2', nc: '#141414', w: '100 кг × 8', tag: 'none', t: '0:51', ok: '✓', okc: '#141414', bd: line },
{ no: '3', nc: '#C93C12', w: '…', tag: 'none', t: '0:42', ok: 'зараз', okc: '#C93C12', bd: '0' }
];
return { sets, ...ui };
}
}
</script>
</body>
</html>
