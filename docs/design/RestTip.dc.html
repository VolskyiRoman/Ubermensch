<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Порада на відпочинок</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>

<circle cx="60" cy="58" r="11" fill="#C93C12"></circle>

<sc-if value="{{is2}}" hint-placeholder-val="{{ false }}">
<svg width="120" height="110" viewBox="0 0 120 110" role="img" aria-label="Телефон спить">
<circle cx="60" cy="58" r="48" fill="#FFFFFF"></circle>

<rect x="44" y="26" width="32" height="58" rx="4" fill="#F4F4F1"></rect>

<rect x="54" y="88" width="12" height="2.5" rx="1.25" fill="#5E5E58"></rect>
</svg>
</sc-if>
<sc-if value="{{is3}}" hint-placeholder-val="{{ false }}">
<svg width="120" height="110" viewBox="0 0 120 110" role="img" aria-label="Рушник на грифі">

</sc-if>
<sc-if value="{{is4}}" hint-placeholder-val="{{ false }}">

</sc-if>
<sc-if value="{{is5}}" hint-placeholder-val="{{ false }}">
<svg width="120" height="110" viewBox="0 0 120 110" role="img" aria-label="Навушники з нотами">
<circle cx="60" cy="58" r="48" fill="#FFFFFF"></circle>

<rect x="80" y="62" width="18" height="30" rx="7" fill="#C93C12"></rect>
<path d="M56 50V34l12-3v15" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="53" cy="51" r="4" fill="#141414"></circle>
<circle cx="65" cy="47" r="4" fill="#141414"></circle>

</sc-if>
<sc-if value="{{is6}}" hint-placeholder-val="{{ false }}">
<svg width="120" height="110" viewBox="0 0 120 110" role="img" aria-label="Миска з магнезією">
<circle cx="60" cy="58" r="48" fill="#FFFFFF"></circle>
<circle cx="46" cy="48" r="11" fill="#F4F4F1" stroke="#C8C8C0" stroke-width="2"></circle>

<sc-if value="{{is7}}" hint-placeholder-val="{{ false }}">
<svg width="120" height="110" viewBox="0 0 120 110" role="img" aria-label="Серце з лінією пульсу">
<circle cx="60" cy="58" r="48" fill="#FFFFFF"></circle>

<path d="M28 58h18l6-12 8 22 6-14 4 4h22" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</sc-if>
<sc-if value="{{is8}}" hint-placeholder-val="{{ false }}">
<svg width="120" height="110" viewBox="0 0 120 110" role="img" aria-label="Кросівок у русі">
<circle cx="60" cy="58" r="48" fill="#FFFFFF"></circle>

<path d="M52 52l-5 7M59 57l-5 7M66 61l-4 7" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path>
<path d="M8 60h14M4 70h16M10 80h12" stroke="#141414" stroke-width="2.6" stroke-linecap="round"></path>
</svg>
</sc-if>
<sc-if value="{{is9}}" hint-placeholder-val="{{ false }}">
<svg width="120" height="110" viewBox="0 0 120 110" role="img" aria-label="Мішень зі стрілою в центрі">
<circle cx="60" cy="58" r="48" fill="#FFFFFF"></circle>
<circle cx="56" cy="62" r="34" fill="#FBE9E2" stroke="#C93C12" stroke-width="2"></circle>
<circle cx="56" cy="62" r="22" fill="#FFFFFF" stroke="#C93C12" stroke-width="2"></circle>
<circle cx="56" cy="62" r="10" fill="#C93C12"></circle>
<path d="M56 62L96 22" stroke="#141414" stroke-width="3" stroke-linecap="round"></path>
<path d="M90 16l8 0 0 8M96 22l6 0M96 22l0-6" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</sc-if>
<span style="font-size:17px;font-weight:800">{{t.title}}</span>
<span style="font-size:13px;color:#5E5E58;line-height:1.45;max-width:290px">{{t.text}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tip":{"editor":"int","default":0,"min":0,"max":9},"width":{"editor":null,"default":"350px"},"$preview":{"width":350,"height":200}}'>
class Component extends DCLogic {
renderVals() {
const tips = [
{ title: 'Ковтни води', text: 'Кілька ковтків між підходами, і сил на наступний вистачить.' },
{ title: 'Подихай', text: 'Вдих на 4 рахунки, видих на 6. Пульс заспокоїться швидше.' },
{ title: 'Відклади телефон', text: 'Стрічка непомітно з’їдає відпочинок. Таймер сам покличе.' },
{ title: 'Витри руки', text: 'Сухі долоні тримають гриф краще за будь-які рукавички.' },
{ title: 'Згадай техніку', text: 'Одна підказка собі на підхід: «груди вперед» чи «коліна назовні».' },
{ title: 'Перемкни трек', text: 'Наступний підхід під улюблену пісню піде легше.' },
{ title: 'Магнезія', text: 'Попереду важкий підхід? Натри руки, поки є час.' },
{ title: 'Послухай пульс', text: 'Дихання вирівнялось? Можна йти навіть трохи раніше.' },
{ title: 'Не сідай', text: 'Легка ходьба відновлює краще, ніж сидіння на лавці.' },
{ title: 'Уяви підхід', text: 'Прокрути в голові всі повтори. Мозок готує м’язи заздалегідь.' }
];
const i = ((Number(this.props.tip ?? 0) % 10) + 10) % 10;
const flags = {};
for (let k = 0; k < 10; k++) flags['is' + k] = k === i;
return { ...flags, t: tips[i], w: this.props.width ?? '350px' };
}
}
</script>
</body>
</html>
